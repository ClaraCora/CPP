name: Validate public installers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Scan history and working tree for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact
          gitleaks dir . --redact
      - name: Validate shell syntax
        run: |
          bash -n install.sh
          sh -n corade-install.sh
          sh -n time-sync-check.sh
      - name: Verify authenticated release installers
        run: |
          sh .github/tests/installer-signature-test.sh install.sh
          sh .github/tests/installer-signature-test.sh corade-install.sh
